[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-drone-workshop"
version = "0.1.0"
description = "Learn EEG motor-imagery decoding by controlling a simulated drone"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2",
  "mne>=1.7,<2", "matplotlib>=3.8,<4", "pygame>=2.5,<3", "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
eeg-drone = "eeg_drone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads public PhysioNet data (opt in with --integration)"]
